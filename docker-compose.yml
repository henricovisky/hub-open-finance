services:
  actual-server:
    image: actualbudget/actual-server:latest
    container_name: actual_server
    restart: unless-stopped
    ports:
      - "5006:5006"
      - "8000:5006"
    volumes:
      - ./actual-data:/data
    environment:
      - PORT=5006
    deploy:
      resources:
        limits:
          memory: 120M
