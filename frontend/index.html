<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hub Financeiro</title>

  <!-- PWA & Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#090D16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hub Fin">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { DEFAULT: '#111827', raised: '#161F30', subtle: '#1E293B' },
            border:  { DEFAULT: '#1F2937', strong: '#374151' },
            ink:     { DEFAULT: '#F1F5F9', muted: '#94A3B8', faint: '#4B5563' }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Pluggy Connect Widget -->
  <script src="https://cdn.pluggy.ai/pluggy-connect.js"></script>

  <!-- App -->
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>

<body class="bg-[#090D16] text-slate-100 min-h-screen flex justify-center font-sans antialiased"
      x-data="hubApp">

  <!-- ═══════════════════════════════════════════════════════
       APP SHELL — centrado no desktop, 100% no mobile
  ════════════════════════════════════════════════════════ -->
  <div class="w-full max-w-md min-h-screen bg-[#090D16] flex flex-col relative shadow-2xl border-x border-white/5">

    <!-- ═══════ TELA DE LOGIN ═══════ -->
    <template x-if="!isAuthenticated">
      <div class="flex-1 flex flex-col justify-center px-6 py-16 animate-fade-in">

        <!-- Logo -->
        <div class="text-center mb-10">
          <div class="inline-flex w-16 h-16 rounded-2xl items-center justify-center mb-5"
               style="background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(139,92,246,0.15)); border: 1px solid rgba(59,130,246,0.3);">
            <i data-lucide="trending-up" class="w-8 h-8 text-blue-400"></i>
          </div>
          <h1 class="text-2xl font-bold tracking-tight text-white">Hub Financeiro</h1>
          <p class="text-sm text-slate-500 mt-1.5">Gestão patrimonial com Open Finance</p>
        </div>

        <!-- Form Card -->
        <div class="bg-surface rounded-2xl p-6 shadow-2xl space-y-4 border border-border">
          <div class="space-y-1">
            <label class="text-[11px] font-semibold tracking-widest text-ink-muted uppercase">E-mail</label>
            <input type="email" x-model="loginEmail" placeholder="seu@email.com"
              @keyup.enter="doLogin"
              class="input-field w-full bg-[#090D16] border border-border rounded-xl px-4 py-3 text-sm text-white placeholder-ink-faint transition-all">
          </div>
          <div class="space-y-1">
            <label class="text-[11px] font-semibold tracking-widest text-ink-muted uppercase">Senha</label>
            <input type="password" x-model="loginPassword" placeholder="••••••••"
              @keyup.enter="doLogin"
              class="input-field w-full bg-[#090D16] border border-border rounded-xl px-4 py-3 text-sm text-white placeholder-ink-faint transition-all">
          </div>

          <template x-if="loginError">
            <div class="flex items-center gap-2 text-xs text-rose-300 bg-rose-500/10 border border-rose-500/20 rounded-xl p-3">
              <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0 text-rose-400"></i>
              <span x-text="loginError"></span>
            </div>
          </template>

          <button @click="doLogin" :disabled="loginLoading"
            class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 disabled:opacity-60 text-white font-semibold py-3.5 rounded-xl text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-900/40">
            <span x-show="loginLoading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full spin"></span>
            <span x-text="loginLoading ? 'Entrando…' : 'Acessar Plataforma'"></span>
          </button>
        </div>

        <p class="text-center text-[11px] text-ink-faint mt-6">
          Seus dados ficam no seu servidor. Privacidade total.
        </p>
      </div>
    </template>

    <!-- ═══════ CONTEÚDO AUTENTICADO ═══════ -->
    <template x-if="isAuthenticated">
      <div class="flex-1 flex flex-col">

        <!-- ──────── HEADER FIXO ──────── -->
        <header class="sticky top-0 z-30 glass-header border-b border-border">
          <!-- Linha superior: Logo + Ações -->
          <div class="flex items-center justify-between px-4 pt-3 pb-2">
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-lg flex items-center justify-center"
                   style="background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3);">
                <i data-lucide="trending-up" class="w-3.5 h-3.5 text-blue-400"></i>
              </div>
              <span class="text-sm font-semibold text-white tracking-tight">Hub Financeiro</span>
            </div>

            <div class="flex items-center gap-1">
              <!-- Ocultar valores -->
              <button @click="toggleHideValues"
                class="w-8 h-8 rounded-lg flex items-center justify-center text-ink-muted hover:text-white hover:bg-surface transition-all">
                <i :data-lucide="hideValues ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
              </button>
              <!-- Atualizar -->
              <button @click="refreshAll"
                class="w-8 h-8 rounded-lg flex items-center justify-center text-ink-muted hover:text-white hover:bg-surface transition-all">
                <i data-lucide="refresh-cw" class="w-4 h-4" :class="{'spin text-blue-400': loading}"></i>
              </button>
            </div>
          </div>

          <!-- Seletor de Contexto -->
          <div class="px-4 pb-2.5">
            <div class="flex bg-[#090D16] p-1 rounded-xl border border-border">
              <button @click="setContext('HOUSEHOLD')"
                :class="currentContext === 'HOUSEHOLD' ? 'bg-blue-600 text-white shadow-sm' : 'text-ink-muted hover:text-white'"
                class="flex-1 py-1.5 text-[11px] font-medium rounded-lg transition-all flex items-center justify-center gap-1.5">
                🏠 Casa
              </button>
              <template x-if="currentUser?.role === 'ADMIN'">
                <button @click="setContext('PERSONAL')"
                  :class="currentContext === 'PERSONAL' ? 'bg-violet-600 text-white shadow-sm' : 'text-ink-muted hover:text-white'"
                  class="flex-1 py-1.5 text-[11px] font-medium rounded-lg transition-all flex items-center justify-center gap-1.5">
                  👤 Pessoal
                </button>
              </template>
              <template x-if="currentUser?.role === 'ADMIN'">
                <button @click="setContext('ALL')"
                  :class="currentContext === 'ALL' ? 'bg-slate-600 text-white shadow-sm' : 'text-ink-muted hover:text-white'"
                  class="flex-1 py-1.5 text-[11px] font-medium rounded-lg transition-all flex items-center justify-center gap-1.5">
                  🌐 Geral
                </button>
              </template>
            </div>
          </div>
        </header>

        <!-- ──────── MAIN SCROLL ──────── -->
        <main class="flex-1 overflow-y-auto no-scrollbar pb-[var(--nav-height)]">

          <!-- ═══════════════════════════════════
               TAB 1 — DASHBOARD
          ════════════════════════════════════ -->
          <div x-show="activeTab === 'dashboard'" class="px-4 py-4 space-y-4">

            <!-- BANNER: SEM CONTAS CONECTADAS (Destaque máximo) -->
            <template x-if="!loading && accounts.length === 0">
              <div class="connect-gradient rounded-2xl p-5 text-center space-y-4">
                <div class="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center"
                     style="background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.4);">
                  <i data-lucide="link" class="w-7 h-7 text-blue-400"></i>
                </div>
                <div>
                  <h3 class="text-base font-bold text-white mb-1">Conecte suas contas</h3>
                  <p class="text-xs text-ink-muted leading-relaxed">
                    Nenhuma instituição financeira conectada ainda.<br>
                    Vincule seus bancos para ver saldos e movimentações.
                  </p>
                </div>
                <template x-if="currentUser?.role === 'ADMIN'">
                  <button @click="openConnectFlow()"
                    class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-semibold py-3.5 rounded-xl text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-900/40">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Conectar Banco ou Cartão
                  </button>
                </template>
                <p class="text-[10px] text-ink-faint">Suporta Nubank, Itaú, Bradesco, Rico, XP e mais de 200 instituições</p>
              </div>
            </template>

            <!-- HERO: SALDO LÍQUIDO -->
            <template x-if="loading || accounts.length > 0">
              <div>
                <template x-if="loading && !overview">
                  <div class="rounded-2xl p-5 border border-border space-y-3">
                    <div class="skeleton h-3 w-36 rounded"></div>
                    <div class="skeleton h-9 w-44 rounded"></div>
                    <div class="skeleton h-3 w-full rounded"></div>
                  </div>
                </template>
                <template x-if="!loading || overview">
                  <div class="rounded-2xl p-5 relative overflow-hidden"
                       style="background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%); border: 1px solid #334155;">
                    <!-- Decorative blob -->
                    <div class="absolute right-0 top-0 w-32 h-32 rounded-full opacity-10"
                         style="background: radial-gradient(circle, #3B82F6, transparent); transform: translate(30%, -30%);"></div>

                    <div class="relative">
                      <div class="flex items-center justify-between mb-1">
                        <span class="text-xs text-ink-muted">Saldo Líquido Disponível</span>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full"
                              style="background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.25);">
                          Contas & Caixas
                        </span>
                      </div>
                      <div class="text-3xl font-bold tracking-tight text-white mt-1 mb-4"
                           x-text="formatMoney(overview?.liquid_balance)"></div>

                      <div class="pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-4 text-xs">
                        <div>
                          <span class="text-ink-faint block text-[10px] mb-0.5">Patrimônio Líquido</span>
                          <span class="text-violet-400 font-semibold" x-text="formatMoney(overview?.net_worth)"></span>
                        </div>
                        <div class="text-right">
                          <span class="text-ink-faint block text-[10px] mb-0.5">Faturas a Vencer</span>
                          <span class="text-rose-400 font-semibold" x-text="formatMoney(overview?.pending_bills_amount)"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- FLUXO DO MÊS: ENTRADAS vs SAÍDAS -->
            <template x-if="!loading || overview">
              <div class="grid grid-cols-2 gap-3">
                <div class="bg-surface rounded-xl p-4 border border-border">
                  <div class="flex items-center gap-2 mb-3">
                    <div class="w-7 h-7 rounded-lg flex items-center justify-center"
                         style="background: rgba(16,185,129,0.15);">
                      <i data-lucide="arrow-down-circle" class="w-3.5 h-3.5 text-emerald-400"></i>
                    </div>
                    <span class="text-[11px] font-medium text-ink-muted">Entradas</span>
                  </div>
                  <div class="text-lg font-bold text-emerald-400" x-text="formatMoney(overview?.monthly_income)"></div>
                  <div class="text-[10px] text-ink-faint mt-1">
                    Média 3M: <span x-text="formatMoney(overview?.three_month_avg_income)"></span>
                  </div>
                </div>

                <div class="bg-surface rounded-xl p-4 border border-border">
                  <div class="flex items-center gap-2 mb-3">
                    <div class="w-7 h-7 rounded-lg flex items-center justify-center"
                         style="background: rgba(239,68,68,0.12);">
                      <i data-lucide="arrow-up-circle" class="w-3.5 h-3.5 text-rose-400"></i>
                    </div>
                    <span class="text-[11px] font-medium text-ink-muted">Saídas</span>
                  </div>
                  <div class="text-lg font-bold text-rose-400" x-text="formatMoney(overview?.monthly_expenses)"></div>
                  <div class="text-[10px] text-ink-faint mt-1">
                    Média 3M: <span x-text="formatMoney(overview?.three_month_avg_expenses)"></span>
                  </div>
                </div>
              </div>
            </template>

            <!-- FLUXO MENSAL REALIZADO -->
            <template x-if="cashflow.length > 0">
              <div class="bg-surface rounded-xl p-4 border border-border">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-xs font-semibold text-white">Fluxo Mensal Realizado</h3>
                  <span class="text-[10px] text-ink-faint">Últimos meses</span>
                </div>
                <div class="space-y-3">
                  <template x-for="item in cashflow" :key="item.month">
                    <div>
                      <div class="flex justify-between items-center text-xs mb-1.5">
                        <span class="text-ink-muted font-medium" x-text="item.month"></span>
                        <span :class="item.net >= 0 ? 'text-emerald-400' : 'text-rose-400'"
                              class="font-semibold" x-text="formatMoney(item.net)"></span>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill"
                             :style="`width: ${Math.min(100, Math.max(8, item.income / (item.income + item.expenses || 1) * 100))}%; background: ${item.net >= 0 ? '#10b981' : '#f43f5e'}`"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- TOP CATEGORIAS -->
            <template x-if="categoriesSummary.length > 0">
              <div class="bg-surface rounded-xl p-4 border border-border">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-xs font-semibold text-white">Despesas por Categoria</h3>
                  <span class="text-[10px] text-ink-faint">vs Média 3M</span>
                </div>
                <div class="space-y-3.5">
                  <template x-for="cat in categoriesSummary" :key="cat.category_name">
                    <div>
                      <div class="flex items-center justify-between text-xs mb-1.5">
                        <div class="flex items-center gap-2 truncate">
                          <span class="w-2 h-2 rounded-full shrink-0" :style="`background: ${cat.color || '#3B82F6'}`"></span>
                          <span class="text-ink-muted truncate" x-text="cat.category_name"></span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0 ml-2">
                          <span class="font-semibold text-white" x-text="formatMoney(cat.total_amount)"></span>
                          <template x-if="cat.variation_vs_avg_pct !== null">
                            <span :class="cat.variation_vs_avg_pct > 0 ? 'text-rose-400' : 'text-emerald-400'"
                                  class="text-[10px] font-semibold w-10 text-right">
                              <span x-text="cat.variation_vs_avg_pct > 0 ? '+' : ''"></span><span x-text="cat.variation_vs_avg_pct"></span>%
                            </span>
                          </template>
                        </div>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill" :style="`width: ${cat.percentage}%; background: ${cat.color || '#3B82F6'}`"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Estado vazio: dados carregados mas sem transações -->
            <template x-if="!loading && accounts.length > 0 && categoriesSummary.length === 0 && cashflow.length === 0">
              <div class="text-center py-8 space-y-2">
                <i data-lucide="inbox" class="w-10 h-10 text-ink-faint mx-auto"></i>
                <p class="text-sm text-ink-muted">Nenhuma movimentação no período</p>
                <p class="text-xs text-ink-faint">Sincronize suas contas para ver dados</p>
              </div>
            </template>

          </div>

          <!-- ═══════════════════════════════════
               TAB 2 — CONTAS & CARTÕES
          ════════════════════════════════════ -->
          <div x-show="activeTab === 'accounts'" class="px-4 py-4 space-y-4">

            <!-- Header da seção -->
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-sm font-semibold text-white">Contas & Cartões</h2>
                <p class="text-[11px] text-ink-faint mt-0.5" x-text="`${accounts.length} conta${accounts.length !== 1 ? 's' : ''} ativa${accounts.length !== 1 ? 's' : ''}`"></p>
              </div>
              <template x-if="currentUser?.role === 'ADMIN'">
                <button @click="openConnectFlow()"
                  class="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition-all">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  Conectar
                </button>
              </template>
            </div>

            <!-- Estado Vazio -->
            <template x-if="!loading && accounts.length === 0">
              <div class="connect-gradient rounded-2xl p-6 text-center space-y-4">
                <i data-lucide="building-2" class="w-10 h-10 text-blue-400 mx-auto"></i>
                <div>
                  <p class="text-sm font-semibold text-white">Nenhuma conta conectada</p>
                  <p class="text-xs text-ink-muted mt-1">Conecte seu banco ou cartão via Open Finance</p>
                </div>
                <template x-if="currentUser?.role === 'ADMIN'">
                  <button @click="openConnectFlow()"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-sm transition-all flex items-center justify-center gap-2">
                    <i data-lucide="link" class="w-4 h-4"></i>
                    Conectar Instituição
                  </button>
                </template>
              </div>
            </template>

            <!-- Skeletons -->
            <template x-if="loading && accounts.length === 0">
              <div class="space-y-3">
                <template x-for="i in [1,2,3]">
                  <div class="bg-surface rounded-xl p-4 border border-border space-y-3">
                    <div class="skeleton h-3 w-28 rounded"></div>
                    <div class="skeleton h-6 w-36 rounded"></div>
                    <div class="skeleton h-2 w-full rounded"></div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Lista de Contas -->
            <div class="space-y-3">
              <template x-for="acc in accounts" :key="acc.id">
                <div class="bg-surface rounded-xl p-4 border border-border card-pressable">
                  <!-- Topo do card -->
                  <div class="flex items-start justify-between mb-3">
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-sm font-semibold text-white truncate" x-text="acc.name"></span>
                        <span class="text-[9px] px-1.5 py-0.5 rounded-md font-semibold uppercase tracking-wide"
                          :class="acc.owner_context === 'HOUSEHOLD' ? 'bg-blue-500/15 text-blue-400' : 'bg-violet-500/15 text-violet-400'"
                          x-text="acc.owner_context === 'HOUSEHOLD' ? '🏠 Casa' : '👤 Pessoal'"></span>
                      </div>
                      <span class="text-[11px] text-ink-faint mt-0.5 block"
                        x-text="acc.type === 'CREDIT' ? 'Cartão de Crédito' : (acc.type === 'INVESTMENT' ? 'Conta Investimento' : 'Conta Corrente')"></span>
                    </div>
                    <template x-if="currentUser?.role === 'ADMIN'">
                      <button @click="openEditAccount(acc)"
                        class="w-7 h-7 rounded-lg flex items-center justify-center text-ink-faint hover:text-white hover:bg-surface-raised transition-all ml-2">
                        <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </template>
                  </div>

                  <!-- Saldo -->
                  <div class="flex items-baseline justify-between">
                    <span class="text-[11px] text-ink-faint">Saldo Atual</span>
                    <span class="text-xl font-bold text-white" x-text="formatMoney(acc.current_balance)"></span>
                  </div>

                  <!-- Cartão: limite -->
                  <template x-if="acc.card">
                    <div class="mt-3 pt-3 border-t border-border/60">
                      <div class="flex justify-between text-[11px] text-ink-faint mb-2">
                        <span>Disponível: <strong class="text-emerald-400" x-text="formatMoney(acc.card.available_limit)"></strong></span>
                        <span>Total: <span x-text="formatMoney(acc.card.limit_amount)"></span></span>
                      </div>
                      <!-- Barra de uso -->
                      <div class="progress-track">
                        <div class="progress-fill"
                             :style="`width: ${Math.min(100, Math.round((1 - acc.card.available_limit / (acc.card.limit_amount || 1)) * 100))}%; background: #f43f5e`"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- Faturas -->
            <template x-if="bills.length > 0">
              <div class="space-y-2.5">
                <h3 class="text-[11px] font-semibold uppercase tracking-widest text-ink-muted pt-2">Faturas de Cartão</h3>
                <template x-for="bill in bills" :key="bill.id">
                  <div class="bg-surface rounded-xl p-3.5 flex items-center justify-between border border-border">
                    <div>
                      <span class="text-xs font-semibold text-white block" x-text="bill.account_name || 'Cartão'"></span>
                      <span class="text-[10px] text-ink-faint" x-text="`Venc. ${formatDate(bill.due_date)}`"></span>
                    </div>
                    <div class="text-right">
                      <span class="text-sm font-bold text-rose-400 block" x-text="formatMoney(bill.total_amount)"></span>
                      <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md inline-block mt-1"
                        :class="bill.status === 'PAID' ? 'pill-connected' : (bill.status === 'OPEN' ? 'pill-warning' : 'pill-error')"
                        x-text="bill.status === 'PAID' ? 'Paga' : (bill.status === 'OPEN' ? 'Aberta' : 'Atrasada')"></span>
                    </div>
                  </div>
                </template>
              </div>
            </template>

          </div>

          <!-- ═══════════════════════════════════
               TAB 3 — EXTRATO
          ════════════════════════════════════ -->
          <div x-show="activeTab === 'transactions'" class="px-4 py-4 space-y-3">

            <div class="flex items-center justify-between">
              <h2 class="text-sm font-semibold text-white">Extrato Consolidado</h2>
              <span class="text-[11px] text-ink-faint" x-text="`${transactions.length} lançamentos`"></span>
            </div>

            <!-- Skeletons -->
            <template x-if="loading && transactions.length === 0">
              <div class="space-y-2">
                <template x-for="i in [1,2,3,4,5]">
                  <div class="bg-surface rounded-xl p-3 border border-border flex items-center gap-3">
                    <div class="skeleton w-8 h-8 rounded-lg shrink-0"></div>

            </div>
          </div>
        </template>

        <!-- ══════════════════════════════════════
             DRAWER: EDITAR CONTA
        ════════════════════════════════════════ -->
        <template x-if="accountDetailModal.open">
          <div class="fixed inset-0 z-50 flex items-end justify-center glass-modal animate-fade-in">
            <div @click.away="accountDetailModal.open = false"
                 class="bg-[#111827] border border-border w-full max-w-md rounded-t-2xl shadow-2xl animate-slide-up">

              <div class="flex justify-center pt-3 pb-1">
                <div class="w-10 h-1 bg-slate-700 rounded-full"></div>
              </div>

              <div class="px-5 pb-8 pt-2 space-y-4">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-bold text-white">Configurar Conta</h3>
                  <button @click="accountDetailModal.open = false"
                    class="w-8 h-8 rounded-lg flex items-center justify-center text-ink-muted hover:text-white hover:bg-surface transition-all">
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                </div>

                <div class="bg-[#090D16] rounded-xl p-3.5 border border-border">
                  <span class="text-xs font-semibold text-white" x-text="accountDetailModal.account?.name"></span>
                  <span class="text-[10px] text-ink-faint block mt-0.5"
                        x-text="accountDetailModal.account?.type"></span>
                </div>

                <div class="space-y-1.5">
                  <label class="text-[11px] font-semibold tracking-wider text-ink-muted uppercase">Contexto da Conta</label>
                  <div class="flex gap-2">
                    <button type="button" @click="accountDetailModal.ownerContext = 'HOUSEHOLD'"
                      :class="accountDetailModal.ownerContext === 'HOUSEHOLD' ? 'bg-blue-600 text-white' : 'bg-[#090D16] text-ink-muted border border-border'"
                      class="flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all">🏠 Casa</button>
                    <button type="button" @click="accountDetailModal.ownerContext = 'PERSONAL'"
                      :class="accountDetailModal.ownerContext === 'PERSONAL' ? 'bg-violet-600 text-white' : 'bg-[#090D16] text-ink-muted border border-border'"
                      class="flex-1 py-2.5 text-xs font-semibold rounded-xl transition-all">👤 Pessoal</button>
                  </div>
                </div>

                <button @click="saveAccountContext" :disabled="accountDetailModal.saving"
                  class="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-60 text-white font-semibold py-3.5 rounded-xl text-sm transition-all flex items-center justify-center gap-2">
                  <span x-show="accountDetailModal.saving" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full spin"></span>
                  <span x-text="accountDetailModal.saving ? 'Salvando…' : 'Salvar Configuração'"></span>
                </button>
              </div>
            </div>
          </div>
        </template>

      </div>
    </template>

    <!-- ══════════════════════════════════════
         TOAST NOTIFICATION
    ════════════════════════════════════════ -->
    <template x-if="toast.show">
      <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] w-11/12 max-w-sm px-4 py-3 rounded-2xl shadow-2xl text-xs flex items-center gap-2.5 animate-fade-in"
           :class="{
             'bg-emerald-950/95 text-emerald-200 border border-emerald-800/50': toast.type === 'success',
             'bg-rose-950/95 text-rose-200 border border-rose-800/50': toast.type === 'error',
             'bg-slate-900/95 text-slate-200 border border-slate-700': toast.type === 'info'
           }">
        <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
             :class="toast.type === 'success' ? 'bg-emerald-500/20' : (toast.type === 'error' ? 'bg-rose-500/20' : 'bg-blue-500/20')">
          <i :data-lucide="toast.type === 'success' ? 'check' : (toast.type === 'error' ? 'x' : 'info')" class="w-3 h-3"></i>
        </div>
        <span class="flex-1" x-text="toast.message"></span>
      </div>
    </template>

  </div>

  <script>
    // Re-inicializa ícones Lucide após renderizações Alpine
    const reinitIcons = () => { if (window.lucide) lucide.createIcons(); };
    document.addEventListener("DOMContentLoaded", reinitIcons);
    window.addEventListener("alpine:initialized", () => setTimeout(reinitIcons, 80));
    document.addEventListener("alpine:mutation", () => setTimeout(reinitIcons, 40));

    // Garante ícones após modais atualizarem DOM
    const observer = new MutationObserver(() => setTimeout(reinitIcons, 30));
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
